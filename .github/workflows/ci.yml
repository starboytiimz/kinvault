name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  soroban-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test
      - run: cargo build --manifest-path contracts/kinvault/Cargo.toml --target wasm32v1-none --release
